<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sync test — union portal to commuter app</title>
</head>
<body>
<pre id="results">running…</pre>
<iframe id="portal" src="../union/index.html" style="width:1100px;height:700px;border:0"></iframe>
<iframe id="app" src="../commuter/index.html" style="width:420px;height:900px;border:0"></iframe>

<script>
var results = [], fails = 0;
function ok(cond, msg) { results.push((cond ? 'pass  ' : 'FAIL  ') + msg); if (!cond) fails++; flush(); }
function flush() { document.getElementById('results').textContent = results.join('\n'); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var portal, app;
function pq(s) { return portal.contentDocument.querySelector(s); }
function pqa(s) { return Array.prototype.slice.call(portal.contentDocument.querySelectorAll(s)); }
function aq(s) { return app.contentDocument.querySelector(s); }
function aqa(s) { return Array.prototype.slice.call(app.contentDocument.querySelectorAll(s)); }
function pclick(el) { el.dispatchEvent(new portal.contentWindow.MouseEvent('click', { bubbles: true })); }
function aclick(el) { el.dispatchEvent(new app.contentWindow.MouseEvent('click', { bubbles: true })); }

(async function () {
  portal = document.getElementById('portal');
  app = document.getElementById('app');
  try {
    await waitFor(function () {
      return portal.contentDocument && app.contentDocument &&
        portal.contentDocument.readyState === 'complete' && app.contentDocument.readyState === 'complete' &&
        portal.contentDocument.querySelector('#viewFleet tbody tr') &&
        app.contentDocument.querySelector('#tabbar button');
    });
    await sleep(800);

  ok(pqa('#viewFleet tbody tr').length === 14, 'portal lists all 14 vehicles');
  ok(pqa('[data-view="calls"]').length === 0, 'portal has no driver-calls section');
  ok(pqa('#sideNav [data-view]').length === 4, 'portal nav includes fleet, alerts, reports, and settings');
  ok(!!pq('#sideNoteBody') && pq('#sideNoteBody').textContent.indexOf('phone') !== -1,
     'portal explains that drivers phone the union');

  /* --- union operator marks a vehicle out of service --- */
  var row = pqa('#viewFleet tbody tr').filter(function (tr) { return tr.textContent.indexOf('LEB-7788') !== -1; })[0];
  ok(!!row, 'found the bus to update by hand (LEB-7788)');
  ok(row && row.tabIndex === 0 && row.getAttribute('aria-label').indexOf('LEB-7788') !== -1,
    'fleet rows are labelled and keyboard focusable');
  row.dispatchEvent(new portal.contentWindow.KeyboardEvent('keydown', {
    key: 'Enter', bubbles: true, cancelable: true
  }));
  await sleep(200);
  ok(!!pq('#publishBtn') && portal.contentDocument.activeElement === pq('#statusGroup input'),
    'keyboard activation opens the editor and moves focus to the status controls');
  pclick(row);
  await sleep(300);
  ok(!!pq('#publishBtn'), 'vehicle status panel opens');

  pclick(pq('[data-status="out_of_service"]'));
  await sleep(150);
  var note = pq('#noteInput');
  note.value = 'Mechanical breakdown near Federal B Area';
  note.dispatchEvent(new portal.contentWindow.Event('input', { bubbles: true }));
  await sleep(100);

  var previewText = portal.contentDocument.querySelectorAll('.preview-note')[0].textContent;
  ok(previewText.indexOf('out of service') !== -1, 'portal shows the message the commuter will read');

  pclick(pq('#publishBtn'));
  await sleep(1200);

  /* --- the commuter app must now show the alert --- */
  var banner = aq('#homeAlerts');
  ok(!!banner && banner.textContent.length > 10, 'commuter home shows the union alert banner');
  ok(banner && banner.textContent.indexOf('out of service') !== -1, 'alert text reaches the commuter app');
  ok(banner && banner.textContent.indexOf('LEB-7788') !== -1, 'alert names the vehicle that is off the road');

  var appKTA = app.contentWindow.KTA;
  var stoppedVehicle = appKTA.data.VEHICLES.filter(function (v) { return v.plate === 'LEB-7788'; })[0];
  var originalAppNow = app.contentWindow.Date.now;
  var simulatedNow = originalAppNow();
  app.contentWindow.Date.now = function () { return simulatedNow; };
  var stoppedPosition = appKTA.sim.vehicleState(stoppedVehicle);
  simulatedNow += 60000;
  var stoppedPositionLater = appKTA.sim.vehicleState(stoppedVehicle);
  app.contentWindow.Date.now = originalAppNow;
  ok(!!appKTA.sim.opsFor(stoppedVehicle.id).frozenPosition, 'out-of-service status stores the vehicle position');
  ok(stoppedPosition.x === stoppedPositionLater.x && stoppedPosition.y === stoppedPositionLater.y,
    'out-of-service vehicle stays in its last position as time advances');

  var mapTab = aqa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'map'; })[0];
  aclick(mapTab);
  await sleep(300);
  var stoppedMarker = aq('#mapSvg .veh[data-veh="' + stoppedVehicle.id + '"]');
  var markerTransform = stoppedMarker && stoppedMarker.getAttribute('transform');
  await sleep(1300);
  ok(!!markerTransform && stoppedMarker.getAttribute('transform') === markerTransform,
    'out-of-service bus map marker remains at its last position through map refreshes');
  var activeClockFactor = appKTA.store.read().settings.clockFactor;
  appKTA.store.update(function (stored) {
    delete stored.vehicles[stoppedVehicle.id].frozenPosition;
  });
  var migratedPosition = appKTA.sim.opsFor(stoppedVehicle.id).frozenPosition;
  appKTA.store.update(function (stored) { stored.settings.clockFactor = 12; });
  var migratedPositionAfterSpeedChange = appKTA.sim.vehicleState(stoppedVehicle);
  ok(!!migratedPosition && migratedPositionAfterSpeedChange.x === migratedPosition.x &&
    migratedPositionAfterSpeedChange.y === migratedPosition.y,
    'legacy out-of-service records stay frozen when demo speed changes');
  appKTA.store.update(function (stored) { stored.settings.clockFactor = activeClockFactor; });
  var homeTab = aqa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'home'; })[0];
  aclick(homeTab);
  await sleep(200);

  /* the affected vehicle must not be offered as an arrival any more */
  var stopsWithVehicle = aqa('#homeNearby .eta-card').filter(function (c) { return c.textContent.indexOf('LEB-7788') !== -1; });
  ok(stopsWithVehicle.length === 0, 'an out-of-service vehicle is no longer listed as an arrival');

  /* alerts screen */
  var alertBtn = aq('#btnMapAlerts');
  var tabAlerts = aqa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'home'; })[0];
  aclick(tabAlerts);
  await sleep(200);
  ok(!!aq('#btnMapAlerts'), 'commuter app has an alerts entry point');

  /* driver reassignment, edited by hand in the same panel */
  var row2 = pqa('#viewFleet tbody tr').filter(function (tr) { return tr.textContent.indexOf('KHI-4455') !== -1; })[0];
  ok(!!row2, 'found a second vehicle for the driver reassignment check');
  if (row2) {
    pclick(row2);
    await sleep(300);
    var sel = pq('#driverSelect');
    ok(!!sel && sel.options.length > 1, 'driver can be reassigned from the vehicle panel');
    if (sel && sel.options.length > 1) {
      sel.value = sel.options[1].value;
      sel.dispatchEvent(new portal.contentWindow.Event('change', { bubbles: true }));
      await sleep(150);
      pclick(pq('#publishBtn'));
      await sleep(900);
      var drvAlert = aq('#homeAlerts');
      ok(drvAlert && drvAlert.textContent.indexOf('driver') !== -1,
         'a hand-made driver change reaches the commuter app');
    }
  }

  appKTA.sim.submitReport({
    type: 'robbery', vehicleId: stoppedVehicle.id, subject: 'Bus complaint',
    description: 'Issue reported on this bus.', location: { label: 'Saddar' }
  });
  appKTA.sim.submitReport({ type: 'sos', note: 'Emergency SOS', location: { label: 'Saddar' } });
  pclick(pqa('#sideNav [data-view="reports"]')[0]);
  await sleep(200);
  ok(pqa('#viewReports [data-report]').length === 2, 'admin reports section lists SOS alerts and complaints');
  ok(pq('#viewReports').textContent.indexOf('Bus complaint') !== -1 &&
    pq('#viewReports').textContent.indexOf('B21') !== -1 &&
    pq('#viewReports').textContent.indexOf('LEB-7788') !== -1,
    'admin complaint shows its associated bus route number and plate');
  ok(pq('#viewReports').textContent.indexOf('SOS alert') !== -1,
    'admin reports section identifies submitted SOS alerts');

  results.push('');
  results.push(fails === 0 ? 'ALL PASS' : fails + ' FAILURES');
  document.title = fails === 0 ? 'PASS' : 'FAIL';
  flush();
  } catch (e) {
    results.push('ERROR  ' + (e && e.message ? e.message : e));
    results.push('ERROR  ' + (e && e.stack ? e.stack.split('\n')[1] : ''));
    flush();
  }
})();

function waitFor(fn, timeout) {
  var start = Date.now();
  var limit = timeout || 8000;
  return new Promise(function (resolve, reject) {
    (function poll() {
      var v;
      try { v = fn(); } catch (e) { v = false; }
      if (v) return resolve(true);
      if (Date.now() - start > limit) return reject(new Error('timeout waiting for the app to load'));
      setTimeout(poll, 60);
    })();
  });
}
</script>
</body>
</html>

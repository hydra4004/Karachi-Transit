<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI smoke test — Karachi Transit prototype</title>
</head>
<body>
<pre id="results">running…</pre>
<iframe id="app" src="../commuter/index.html" style="width:420px;height:900px;border:0"></iframe>

<script>
/* Drives the real commuter app inside the iframe and reports what happened.
   Run with:  node prototype/tests/run-ui-test.js  (or open this file over http) */
var results = [];
var fails = 0;

function ok(cond, msg) {
  results.push((cond ? 'pass  ' : 'FAIL  ') + msg);
  if (!cond) fails++;
  flush();
}
function flush() { document.getElementById('results').textContent = results.join('\n'); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var app;

function q(sel) { return app.contentDocument.querySelector(sel); }
function qa(sel) { return Array.prototype.slice.call(app.contentDocument.querySelectorAll(sel)); }
function text(sel) { var e = q(sel); return e ? e.textContent.trim() : ''; }
function click(el) { el.dispatchEvent(new app.contentWindow.MouseEvent('click', { bubbles: true })); }
function overlaps(a, b) {
  var x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
  return x.left < y.right && x.right > y.left && x.top < y.bottom && x.bottom > y.top;
}

(async function () {
  app = document.getElementById('app');
  await new Promise(function (r) { app.addEventListener('load', r); });
  await sleep(600);

  var doc = app.contentDocument;

  /* --- shell --- */
  ok(qa('#tabbar button').length === 5, 'tab bar has 5 tabs');
  ok(!!q('.screen[data-screen="home"].active'), 'home screen is active on load');
  app.style.width = '360px';
  await sleep(50);
  var homeQuickBottom = q('#homeQuick .quick-grid').getBoundingClientRect().bottom;
  var homeSearchTop = q('.screen[data-screen="home"] .searchbar').getBoundingClientRect().top;
  ok(homeSearchTop - homeQuickBottom >= 16, 'mobile home separates quick actions from search by at least 16px');
  app.style.width = '1280px';
  q('.phone').style.width = '760px';
  await sleep(50);
  homeQuickBottom = q('#homeQuick .quick-grid').getBoundingClientRect().bottom;
  homeSearchTop = q('.screen[data-screen="home"] .searchbar').getBoundingClientRect().top;
  ok(homeSearchTop - homeQuickBottom >= 16, 'desktop home separates quick actions from search by at least 16px');
  q('.phone').style.removeProperty('width');
  app.style.width = '420px';
  ok(qa('#tabbar button[aria-current="page"]').length === 1 &&
    q('#tabbar button[aria-current="page"]').getAttribute('data-tab') === 'home',
    'primary navigation exposes exactly one current destination');
  ok(q('.screen[data-screen="home"] .screen-pad').firstElementChild.id === 'homeQuick',
    'quick actions are the first content on the home page');
  ok(!q('#homeRecent') && !q('#homeRoutes') && !q('#btnSosTop'),
    'home avoids duplicate route lists, static recent-search chips, and a duplicate SOS shortcut');
  ok(text('#qaRobbery') === 'Complaint', 'home action is labeled Complaint');
  var nearbyRoutes = qa('#homeNearby .eta-card').map(function (card) {
    return card.querySelector('.routechip').textContent.trim();
  });
  ok(nearbyRoutes.every(function (route, i) { return nearbyRoutes.indexOf(route) === i; }),
    'nearby arrivals show each route only once');
  ok(qa('#homeNearby .eta-card').every(function (card) {
    return card.tagName === 'BUTTON' && card.lastElementChild.classList.contains('eta-main');
  }), 'nearby arrival cards have valid button structure and aligned ETAs');
  ok(qa('#homeNearby .routechip').every(function (chip) {
    return app.contentWindow.getComputedStyle(chip).backgroundColor === 'rgb(37, 99, 235)';
  }), 'vehicle-number badges use the blue brand color');
  ok(app.contentWindow.getComputedStyle(q('#tabbar')).backdropFilter.indexOf('blur') !== -1 &&
    app.contentWindow.getComputedStyle(q('#homeNearby .eta-card')).backdropFilter === 'none',
    'navigation uses liquid glass while arrival content stays clear');
  ok(app.contentWindow.getComputedStyle(q('#q')).backdropFilter === 'none' &&
    app.contentWindow.getComputedStyle(q('#homePlaces .chip')).backdropFilter === 'none',
    'search and saved-place controls stay opaque for legibility');
  doc.body.classList.add('contrast');
  var warningIconStyle = app.contentWindow.getComputedStyle(q('#qiRobbery'));
  ok(warningIconStyle.color !== warningIconStyle.backgroundColor,
    'high-contrast mode keeps quick-action icons distinguishable from their backgrounds');
  doc.body.classList.remove('contrast');

  /* --- T1: find a route --- */
  var routesTab = qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'routes'; })[0];
  click(routesTab);
  await sleep(200);
  ok(!!q('.screen[data-screen="routes"].active'), 'routes tab opens the routes screen');
  ok(qa('#routeList .routecard').length === 8, 'all 8 routes are listed (got ' + qa('#routeList .routecard').length + ')');

  var b13 = qa('#routeList .routecard').filter(function (b) { return b.textContent.indexOf('B13') !== -1; })[0];
  click(b13);
  await sleep(250);
  ok(!!q('.screen[data-screen="route"].active'), 'tapping a route opens the route detail');
  ok(qa('#routeBody .stoprow').length === 6, 'B13 shows all 6 stops (got ' + qa('#routeBody .stoprow').length + ')');
  ok(qa('#routeBody .vehiclecard').length === 3, 'B13 shows its 3 vehicles on the route');

  /* --- map --- */
  click(q('#btnRouteMap'));
  await sleep(300);
  ok(!!q('.screen[data-screen="map"].active'), 'route map button opens the live map');
  ok(qa('#mapSvg .route-line').length === 8, 'map draws all 8 route lines');
  ok(qa('#mapSvg .veh').length > 10, 'map draws the vehicles (' + qa('#mapSvg .veh').length + ')');
  ok(qa('#mapSvg .map-road').length >= 7 && qa('#mapSvg .map-park').length === 2,
    'map adds subtle road and neighborhood context below transit routes');
  ok(qa('#mapSvg .veh[role="button"][tabindex="0"]').length === qa('#mapSvg .veh').length,
    'every vehicle marker is named and keyboard focusable');
  ok(q('#mapIn').getAttribute('aria-label') === 'Zoom in' &&
    app.contentWindow.getComputedStyle(q('#mapIn')).width === '48px',
    'map controls have clear accessible labels and generous touch targets');
  ok(!q('.map-legend [data-i18n="map.oos"]'), 'map legend only lists public transport modes');
  ok(app.contentWindow.getComputedStyle(q('.map-legend [data-i18n="map.bus"]').previousElementSibling).backgroundColor === 'rgb(37, 99, 235)' &&
    app.contentWindow.getComputedStyle(q('.map-legend [data-i18n="map.chinchi"]').previousElementSibling).backgroundColor === 'rgb(21, 128, 61)',
    'map legend colors match the bus and chinchi route lines');
  ok(text('.screen[data-screen="map"] .appbar .sub').indexOf('Approximate landmarks') !== -1,
    'map explains that landmarks are approximate and route positions are simulated');
  var mapStopsMatchRoutes = app.contentWindow.KTA.data.ROUTES.every(function (route) {
    var points = route.path.map(function (point) { return point.join(','); });
    return route.stopIds.every(function (id) {
      var stop = app.contentWindow.KTA.data.STOPS.filter(function (candidate) { return candidate.id === id; })[0];
      return stop && points.indexOf(stop.x + ',' + stop.y) !== -1;
    });
  });
  ok(mapStopsMatchRoutes, 'every simulated route line passes through its listed stop markers');
  var fiveStar = app.contentWindow.KTA.data.STOPS.filter(function (stop) { return stop.id === 'st_north'; })[0];
  var hadeed = app.contentWindow.KTA.data.STOPS.filter(function (stop) { return stop.id === 'st_gulshan'; })[0];
  ok(fiveStar.name.indexOf('North Nazimabad') !== -1 && fiveStar.x < 200 && fiveStar.y < 200 &&
    hadeed.x > 950 && hadeed.y < 400,
    'corrected Google Maps areas place Five Star north-west and Gulshan-e-Hadeed far east');
  var northPlan = app.contentWindow.KTA.sim.findPlan('st_jpo', 'st_north');
  ok(northPlan && northPlan.steps.length === 2 &&
    northPlan.steps[1].routeId === 'r_c3' && northPlan.steps[1].fromStop === 'st_bhattigate' &&
    northPlan.steps[1].toStop === 'st_north',
    'Saddar-to-Five-Star plan uses the corrected Regal Chowk to North Nazimabad segment');
  ok(app.contentWindow.getComputedStyle(doc.body).colorScheme === 'dark' &&
    app.contentWindow.getComputedStyle(q('#mapSvg .map-background')).fill === 'rgb(10, 23, 22)',
    'normal mode uses a dark palette for the map and native controls');
  doc.body.classList.add('contrast');
  ok(app.contentWindow.getComputedStyle(doc.body).colorScheme === 'light' &&
    app.contentWindow.getComputedStyle(q('#mapSvg .map-background')).fill === 'rgb(233, 241, 247)',
    'high-contrast mode switches the full map to its light palette');
  var activeRouteChip = q('#mapChips .mc-route.on');
  ok(app.contentWindow.getComputedStyle(activeRouteChip).color === 'rgb(255, 255, 255)' &&
    app.contentWindow.getComputedStyle(activeRouteChip).backgroundColor !== 'rgb(255, 255, 255)' &&
    app.contentWindow.getComputedStyle(q('#mapChips .mc-lbl')).color === 'rgb(0, 0, 0)',
    'map filter text stays readable in light high-contrast mode');
  doc.body.classList.remove('contrast');
  ok(app.contentWindow.getComputedStyle(q('#mapChips .mc-lbl')).color === 'rgb(208, 217, 211)' &&
    app.contentWindow.getComputedStyle(activeRouteChip).color === 'rgb(255, 255, 255)',
    'map filter text stays readable in dark mode');

  /* --- stop sheet --- */
  var stopDot = qa('#mapSvg .stop-dot').filter(function (d) { return d.getAttribute('data-stop') === 'st_ghanta'; })[0];
  click(stopDot);
  await sleep(250);
  ok(!!q('#scrim.open'), 'tapping a chinchi point opens the stop sheet');
  ok(q('#sheet').textContent.indexOf('Merewether') !== -1, 'stop sheet names the landmark stop');
  ok(!!q('#sheet .landmark-svg'), 'stop sheet shows the landmark illustration (FR9)');
  click(q('#scrim'));
  await sleep(150);
  var vehicleMarker = q('#mapSvg .veh');
  vehicleMarker.dispatchEvent(new app.contentWindow.KeyboardEvent('keydown', {
    key: 'Enter', bubbles: true, cancelable: true
  }));
  await sleep(150);
  ok(!!q('#scrim.open') && q('#sheet').textContent.indexOf(vehicleMarker.getAttribute('aria-label').split(', ')[1]) !== -1,
    'keyboard activation opens the focused vehicle details');
  click(q('#scrim'));
  await sleep(100);

  /* --- map route filter (multi-select) --- */
  click(qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'map'; })[0]);
  await sleep(300);
  ok(!!q('.screen[data-screen="map"].active'), 'map tab is open for filter test');
  var routeChips = qa('#mapChips [data-maproute]');
  ok(routeChips.length === 8, 'map shows one chip per route for filtering (' + routeChips.length + ')');
  /* start fresh on All */
  var allChip = qa('#mapChips [data-mapfilter]').filter(function (b) { return b.getAttribute('data-mapfilter') === 'all'; })[0];
  if (allChip) click(allChip);
  await sleep(200);
  var visBefore = qa('#mapSvg .veh').length;
  var b13chip = qa('#mapChips [data-maproute]').filter(function (b) { return b.textContent.indexOf('B13') !== -1; })[0];
  var c1chip  = qa('#mapChips [data-maproute]').filter(function (b) { return b.textContent.indexOf('C1') !== -1; })[0];
  click(b13chip);
  await sleep(150);
  click(c1chip);
  await sleep(200);
  var visAfter = qa('#mapSvg .veh').length;
  ok(visAfter > 0 && visAfter < visBefore, 'ticking individual routes hides vehicles from the other routes');
  ok(qa('#mapSvg .stop-group[style*="none"]').length > 0, 'stops only served by hidden routes are hidden from the map');
  /* back to all */
  if (allChip) click(allChip);
  await sleep(200);

  /* --- T3: planner --- */
  var planTab = qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'plan'; })[0];
  click(planTab);
  await sleep(250);
  var chip = qa('#planSuggestions .chip').filter(function (c) { return c.textContent.indexOf('Sea View') !== -1; })[0];
  click(chip);
  await sleep(250);
  ok(qa('#planResult .step').length >= 3, 'planner returns a multi-vehicle journey (' + qa('#planResult .step').length + ' steps)');
  ok(q('#planResult').textContent.indexOf('B13') !== -1 && q('#planResult').textContent.indexOf('B21') !== -1,
    'planner names both vehicles (B13 and B21)');
  ok(q('#planResult').textContent.indexOf('PECHS') !== -1, 'planner names the transfer stop');
  ok(q('#planResult').textContent.indexOf('Why this journey') === -1, 'planner reasons are shown per step');

  /* --- T4: SOS hold + cancel --- */
  var sosQuick = q('#qaSos');
  click(sosQuick);
  await sleep(250);
  ok(!!q('.screen[data-screen="safety"].active'), 'SOS opens the safety screen');
  var sosBtn = q('#sosBtn');
  ok(!!sosBtn, 'SOS button is present');

  sosBtn.dispatchEvent(new app.contentWindow.PointerEvent('pointerdown', { bubbles: true }));
  await sleep(2400);
  ok(!!q('#sosCount'), 'holding for 2 s starts the cancel countdown (IR3)');
  var cancelBtn = q('#btnCancelSos');
  ok(!!cancelBtn, 'cancel is visible during the countdown (user control)');
  if (cancelBtn) { click(cancelBtn); await sleep(250); }
  ok(!q('#sosCount') && !!q('#sosBtn'), 'cancelling the SOS returns to the idle state');
  ok(qa('#safetyBody .card').length >= 0, 'safety screen stays usable after cancel');

  /* --- complaint report --- */
  click(q('#btnRobbery'));
  await sleep(250);
  ok(!!q('#scrim.open'), 'complaint report opens a separate form (not the SOS flow)');
  ok(!!q('#rbSubject[required]') && !!q('#rbDesc[required]') &&
    !!q('#rbEvidence[type="file"][accept="image/*"]:not([required])'),
    'complaint form has subject, description and an optional image attachment');
  ok(!q('#rbTypes') && !q('#rbAmount'), 'complaint form has no category or amount field');
  q('#rbSubject').value = 'Phone theft';
  q('#rbDesc').value = 'A phone was taken near the stop.';
  q('#rbVehicle').value = 'v_b13_1';
  q('#robberyForm').dispatchEvent(new app.contentWindow.Event('submit', { bubbles: true, cancelable: true }));
  await sleep(250);
  ok(q('#safetyBody').textContent.indexOf('Phone theft') !== -1 &&
    q('#safetyBody').textContent.indexOf('A phone was taken') !== -1,
    'the submitted complaint appears in My reports');
  var userComplaint = app.contentWindow.KTA.sim.reports()[0];
  ok(userComplaint.vehicleId === 'v_b13_1' && userComplaint.routeNumber === 'B13',
    'complaints can be associated with a bus and retain its route number');

  /* planner map selection */
  click(planTab);
  await sleep(250);
  ok(!q('#stopList') && !!q('#planFrom[data-plan-pick="from"]'), 'planner uses map selection instead of a stop dropdown');
  app.style.width = '360px';
  await sleep(50);
  ok(!overlaps(q('#btnSwap'), q('#planFrom')) && !overlaps(q('#btnSwap'), q('#planTo')) &&
    q('#btnSwap').getBoundingClientRect().top >= q('#planFrom').getBoundingClientRect().bottom &&
    q('#planTo').getBoundingClientRect().top >= q('#btnSwap').getBoundingClientRect().bottom,
    'mobile planner swap control sits between the origin and destination without overlap');
  app.style.width = '1280px';
  q('.phone').style.width = '760px';
  await sleep(50);
  var originRect = q('#planFrom').getBoundingClientRect();
  var swapRect = q('#btnSwap').getBoundingClientRect();
  var destinationRect = q('#planTo').getBoundingClientRect();
  ok(!overlaps(q('#btnSwap'), q('#planFrom')) && !overlaps(q('#btnSwap'), q('#planTo')) &&
    originRect.right < swapRect.left && swapRect.right < destinationRect.left,
    'desktop planner aligns the swap control between fields without overlap');
  doc.documentElement.setAttribute('dir', 'rtl');
  doc.body.classList.add('rtl');
  await sleep(50);
  originRect = q('#planFrom').getBoundingClientRect();
  swapRect = q('#btnSwap').getBoundingClientRect();
  destinationRect = q('#planTo').getBoundingClientRect();
  ok(!overlaps(q('#btnSwap'), q('#planFrom')) && !overlaps(q('#btnSwap'), q('#planTo')) &&
    originRect.left > swapRect.right && swapRect.left > destinationRect.right,
    'desktop RTL planner keeps the swap control between fields without overlap');
  doc.documentElement.setAttribute('dir', 'ltr');
  doc.body.classList.remove('rtl');
  ok(q('#btnSwap').getAttribute('aria-label') === 'Swap starting point and destination',
    'planner swap control has a descriptive accessible label');
  q('.phone').style.removeProperty('width');
  app.style.width = '420px';
  click(q('#planFrom'));
  await sleep(250);
  ok(!!q('.screen[data-screen="map"].plan-picking') && qa('#mapSvg [data-stop]').length === 30,
    'planner map picker exposes stops from the shared dataset');
  ok(q('#mapSvg').getAttribute('viewBox') === '0 0 1000 640', 'planner picker fits the complete stop map');
  ok(!!q('#mapBanner [data-plan-cancel]') && q('#mapBanner [data-plan-cancel]').getBoundingClientRect().height >= 44,
    'planner map selection can be cancelled with a 44px target');
  ok(q('#mapSvg [data-stop="st_nipa"]').getAttribute('role') === 'button' &&
    q('#mapSvg [data-stop="st_nipa"]').getAttribute('tabindex') === '0', 'map stops are keyboard focusable controls');
  click(q('#mapSvg [data-stop="st_nipa"]'));
  await sleep(250);
  ok(!!q('.screen[data-screen="plan"].active') && q('#planFrom').textContent.indexOf('NIPA Chowrangi') !== -1,
    'selecting the verified NIPA landmark returns it once to the planner');
  click(q('#planTo'));
  await sleep(250);
  q('#mapSvg [data-stop="st_seabreeze"]').dispatchEvent(new app.contentWindow.KeyboardEvent('keydown', {
    key: 'Enter', bubbles: true, cancelable: true
  }));
  await sleep(250);
  ok(q('#planTo').textContent.indexOf('Sea Breeze Centre') !== -1, 'keyboard activation selects a destination stop');
  var originName = q('#planFrom').textContent;
  var destinationName = q('#planTo').textContent;
  click(q('#btnSwap'));
  await sleep(100);
  ok(q('#planFrom').textContent === destinationName && q('#planTo').textContent === originName,
    'planner swap control still exchanges the selected origin and destination');

  /* --- language + RTL --- */
  var moreTab = qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'more'; })[0];
  click(moreTab);
  await sleep(250);
  var switches = qa('#moreBody [data-setting]');
  ok(switches.length > 0 && switches.every(function (sw) {
    return sw.tagName === 'BUTTON' && sw.getAttribute('role') === 'switch' &&
      /^(true|false)$/.test(sw.getAttribute('aria-checked'));
  }), 'settings are native, keyboard-operable switches with announced state');
  ok(q('#tabbar button[aria-current="page"]').getAttribute('data-tab') === 'more',
    'tab selection remains announced after navigation');
  var urBtn = qa('#moreBody [data-lang]').filter(function (b) { return b.getAttribute('data-lang') === 'ur'; })[0];
  click(urBtn);
  await sleep(400);
  ok(doc.documentElement.getAttribute('dir') === 'rtl', 'Urdu switches the layout to right-to-left (FR10)');
  ok(doc.body.textContent.indexOf('ٹرانزٹ') !== -1, 'Urdu strings are applied');
  click(q('#btnLangQuick'));
  await sleep(400);
  ok(doc.documentElement.getAttribute('dir') === 'ltr', 'switching back returns to left-to-right');

  /* --- light theme --- */
  var lightMode = qa('#moreBody [data-setting]').filter(function (b) { return b.getAttribute('data-setting') === 'lightMode'; })[0];
  click(lightMode);
  await sleep(200);
  lightMode = qa('#moreBody [data-setting]').filter(function (b) { return b.getAttribute('data-setting') === 'lightMode'; })[0];
  ok(doc.body.classList.contains('light-mode') &&
    app.contentWindow.getComputedStyle(doc.body).colorScheme === 'light' &&
    app.contentWindow.getComputedStyle(doc.body).backgroundColor === 'rgb(243, 246, 244)' &&
    lightMode.getAttribute('aria-checked') === 'true',
    'light mode applies a persistent light palette');
  var mapTabForTheme = qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'map'; })[0];
  click(mapTabForTheme);
  await sleep(250);
  ok(app.contentWindow.getComputedStyle(q('#mapSvg .map-background')).fill === 'rgb(233, 241, 247)',
    'light mode applies the light palette to the map');
  ok(app.contentWindow.getComputedStyle(q('.screen[data-screen="map"] .appbar')).backgroundColor !== 'rgba(10, 20, 18, 0.68)',
    'light mode keeps the map controls on a light surface');
  click(moreTab);
  await sleep(200);
  lightMode = qa('#moreBody [data-setting]').filter(function (b) { return b.getAttribute('data-setting') === 'lightMode'; })[0];
  click(lightMode);
  await sleep(150);

  /* --- accessibility --- */
  var contrast = qa('#moreBody [data-setting]').filter(function (b) { return b.getAttribute('data-setting') === 'contrast'; })[0];
  click(contrast);
  await sleep(250);
  ok(doc.body.classList.contains('contrast'), 'high-contrast mode can be switched on (IR4)');
  click(contrast);
  await sleep(150);

  /* --- offline: last known position with its age (IR5) --- */
  var moreTab2 = qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'more'; })[0];
  click(moreTab2);
  await sleep(250);
  var offSw = qa('#moreBody [data-setting]').filter(function (b) { return b.getAttribute('data-setting') === 'offline'; })[0];
  ok(!!offSw, 'a "simulate connection loss" switch exists');
  click(offSw);
  await sleep(400);
  click(qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'home'; })[0]);
  await sleep(400);
  ok(!!q('#offlineBanner .banner'), 'dropping the connection shows an offline banner (IR5)');
  ok(q('#offlineBanner').textContent.indexOf('last update') !== -1, 'the banner states the age of the last update');
  var etaText = q('#homeNearby').textContent;
  ok(etaText.indexOf('Last known') !== -1, 'ETA cards switch from Live to Last known while offline');
  ok(q('#homeNearby').textContent.indexOf('Live') === -1, 'no ETA claims to be live while offline');
  click(moreTab2);
  await sleep(250);
  click(qa('#moreBody [data-setting]').filter(function (b) { return b.getAttribute('data-setting') === 'offline'; })[0]);
  await sleep(300);
  click(qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'home'; })[0]);
  await sleep(300);
  ok(!q('#offlineBanner .banner'), 'reconnecting clears the offline banner');

  /* --- reviews --- */
  var routesTab2 = qa('#tabbar button').filter(function (b) { return b.getAttribute('data-tab') === 'routes'; })[0];
  click(routesTab2);
  await sleep(200);
  click(qa('#routeList .routecard')[0]);
  await sleep(250);
  var reviewBtn = qa('#routeBody [data-review]')[0];
  click(reviewBtn);
  await sleep(250);
  ok(!!q('#sheet [data-star]'), 'rating sheet opens with 5 stars (IR7)');
  click(qa('#sheet [data-star]')[4]);
  await sleep(100);
  click(q('#revSubmit'));
  await sleep(300);
  ok(!q('#scrim.open'), 'review submits and closes');

  results.push('');
  results.push(fails === 0 ? 'ALL PASS' : fails + ' FAILURES');
  document.title = fails === 0 ? 'PASS' : 'FAIL';
  flush();
})();
</script>
</body>
</html>
